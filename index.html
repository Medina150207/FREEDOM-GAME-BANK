<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101813">
<title>Freedom Game Bank — Что будет, если?</title>
<style>
:root{color-scheme:dark;--bg:#0a100d;--panel:#121d17;--panel2:#1a2920;--line:#304337;--lime:#c7fb65;--green:#75db9b;--text:#f1f7ec;--muted:#a7b5aa;--red:#ff8585;--amber:#ffcd75}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 4%,#28432d 0,transparent 35%),var(--bg);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.shell{max-width:1080px;margin:0 auto;padding:24px 22px 55px}.nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 0 20px;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:-.5px;font-size:21px}.brand b{color:var(--lime)}.nav small{color:var(--muted)}.progress{display:flex;gap:7px;margin:22px 0 28px}.progress span{height:5px;border-radius:8px;background:#314336;flex:1}.progress span.on{background:var(--lime)}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}h1{font-size:clamp(32px,5.5vw,61px);letter-spacing:-.055em;line-height:1.08;margin:0 0 18px;max-width:800px}h2{font-size:clamp(23px,3vw,34px);letter-spacing:-.035em;margin:0 0 10px}.lead{font-size:18px;color:#d2dfd2;max-width:740px;margin:0 0 24px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:linear-gradient(145deg,#1c2c21,#121d17);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 40px #0002}.hero{padding:40px;background:linear-gradient(130deg,#203c27,#132018);border:1px solid #48634a;border-radius:28px;margin-bottom:20px}.metric{font-size:clamp(29px,4vw,43px);font-weight:850;letter-spacing:-.045em;line-height:1.2}.metric small{font-size:16px;color:var(--muted)}.pill{display:inline-block;border:1px solid #59745b;color:#d8eec9;background:#2a412e;border-radius:99px;padding:5px 12px;font-size:13px}.btn{border:0;background:var(--lime);color:#15200d;font-weight:800;padding:14px 20px;border-radius:13px;transition:transform .15s;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn:hover{transform:translateY(-1px)}.btn.secondary{color:var(--text);background:#2b4030;border:1px solid #53715a}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.amount{font-variant-numeric:tabular-nums}.field{margin:16px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin:0 0 8px}.field input[type=range]{width:100%;accent-color:var(--lime)}input[type=number],textarea{width:100%;background:#0c1510;color:var(--text);border:1px solid #516452;border-radius:12px;padding:12px}textarea{min-height:104px;resize:vertical}.bar{display:flex;height:23px;overflow:hidden;border-radius:99px;background:#314437;margin:18px 0 8px}.bar span{transition:width .25s}.bar .a{background:var(--lime)}.bar .v{background:#65c79f}.bar .cash{background:#607f83}.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.note{padding:15px 18px;border-radius:14px;border:1px solid #475c47;background:#202f23;margin:18px 0}.note.warn{border-color:#895451;background:#352420}.note.good{border-color:#507b51;background:#213726}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.loss{color:var(--red)}.gain{color:var(--green)}.big-icon{font-size:54px}.sep{border:0;border-top:1px solid var(--line);margin:20px 0}.choice{display:block;width:100%;text-align:left;border:1px solid #536952;background:#213226;color:var(--text);padding:15px;border-radius:14px;margin:9px 0}.choice.selected{border:2px solid var(--lime);background:#304a2f}.screen{animation:appear .24s ease}@keyframes appear{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}footer{margin-top:34px;color:#84978a;font-size:12px}ul{padding-left:22px}li{margin:7px 0}.help{color:var(--amber)}.tiny{font-size:13px}.numrow{display:flex;justify-content:space-between;gap:10px}.error{color:var(--red);font-size:14px;min-height:18px}.tagline{font-size:13px;color:var(--muted)}
@media(max-width:700px){.shell{padding:16px 14px 38px}.nav{align-items:flex-start}.grid,.cards3,.comparison{grid-template-columns:1fr}.panel{padding:20px}.hero{padding:26px}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="nav"><div class="brand">FREEDOM <b>GAME BANK</b></div><small>Финансовый симулятор • MVP 1.0</small></header>
<div class="progress" id="progress" aria-label="Прогресс миссии"></div>
<main id="app" aria-live="polite"></main>
<footer>Все компании, события и средства вымышленные. Симуляция обучает оценке концентрации риска и не является инвестиционной рекомендацией.</footer>
</div>
<script>
(function(){
'use strict';
const TOTAL=100000;
const S={step:0,a:100000,v:0,cash:0,reason:'',first:null,reflection:'',upside:'',missionAmount:30000,missionReason:'',missionViewed:false,missionHelp:false,confidence:50,award:false};
const $=id=>document.getElementById(id);
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ед.';
const pct=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const calc=(a,v,c,change)=>({loss:-a*change/100,total:a*(1+change/100)+v+c,exposure:a/(a+v+c)*100});
const btn=(label,next,cls='')=>'<button class="btn '+cls+'" data-next="'+next+'">'+label+'</button>';
const card=(label,value,extra='')=>'<div class="panel"><div class="muted tiny">'+label+'</div><div class="metric amount '+extra+'">'+value+'</div></div>';
function bar(a,v,c,total){return '<div class="bar" role="img" aria-label="Доли портфеля: Аврора '+pct(a/total*100)+', Вектор '+pct(v/total*100)+', резерв '+pct(c/total*100)+'"><span class="a" style="width:'+a/total*100+'%"></span><span class="v" style="width:'+v/total*100+'%"></span><span class="cash" style="width:'+c/total*100+'%"></span></div><div class="legend"><span><i class="dot" style="background:var(--lime)"></i>Аврора</span><span><i class="dot" style="background:#65c79f"></i>Вектор</span><span><i class="dot" style="background:#607f83"></i>Резерв</span></div>';}
function top(k,title,lead){return '<section class="screen"><div class="eyebrow">Миссия 01 / '+k+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>';}
function field(id,label,val,max){return '<div class="field"><label for="'+id+'"><span>'+label+'</span><b id="'+id+'-value" class="amount">'+money(val)+'</b></label><input type="range" min="0" max="'+max+'" step="1000" id="'+id+'" value="'+val+'"></div>';}
function updateStep(n){S.step=n;window.scrollTo(0,0);render();}
function showError(id,msg){$(id).textContent=msg;}
function render(){
$('progress').innerHTML=Array.from({length:9},(_,i)=>'<span class="'+(i<=S.step?'on':'')+'"></span>').join('');
let h='';
switch(S.step){
case 0:
h=top('Введение','Сможешь ли ты принять инвестиционное решение, если не знаешь будущего?','Ты получишь 100 000 виртуальных единиц, столкнёшься с неожиданной новостью и проверишь, как твой выбор меняет результат.');
h+='<div class="hero"><span class="pill">Без реальных денег</span><h2 style="margin-top:18px">Не угадывай рынок. Исследуй риск.</h2><p class="muted">Здесь важна не максимальная прибыль, а умение объяснить, насколько капитал зависит от одной компании.</p><div class="grid">'+card('Твой стартовый капитал',money(TOTAL))+card('Длительность','5–7 мин')+'</div></div><div class="actions">'+btn('Начать расследование →',1)+'</div></section>';break;
case 1:
h=top('Знакомство','Компания, о которой говорят все','«Аврора» запустила популярный продукт. Её обсуждают друзья, новости и блогеры. Кажется, впереди успех. Но ты пока не знаешь, что случится дальше.');
h+='<div class="grid"><div class="panel"><div class="big-icon">✦</div><span class="pill">Aurora / АВР</span><h2>Аврора</h2><p>Быстрорастущая технологическая компания. Её успех привлекает внимание, но инвестиции в одну компанию зависят от её собственных событий.</p></div><div class="panel"><div class="big-icon">◈</div><span class="pill">Vector / ВКТ</span><h2>Вектор</h2><p>Другая вымышленная компания. Ты можешь распределить деньги между двумя компаниями и резервом.</p></div></div><div class="note">Важно: известность компании не делает её акции безрисковыми. Но здесь нет заранее указанной «идеальной» доли.</div><div class="actions">'+btn('Распределить деньги →',2)+'</div></section>';break;
case 2:
h=top('Первое решение','Куда направишь 100 000?','Распредели деньги между «Авророй», «Вектором» и свободным резервом. Объясни почему. Событие пока скрыто.');
h+='<div class="grid"><div class="panel">'+field('a','Акции «Авроры»',S.a,TOTAL)+field('v','Акции «Вектора»',S.v,TOTAL)+'<div class="field"><label for="cash"><span>Свободный резерв</span><b id="cash-value">'+money(S.cash)+'</b></label><input type="range" min="0" max="100000" step="1000" id="cash" value="'+S.cash+'"></div><div class="numrow"><b>Распределено</b><b id="sum">'+money(S.a+S.v+S.cash)+'</b></div><div id="alloc-error" class="error"></div></div><div class="panel"><h2>Твой портфель</h2><div id="bar">'+bar(S.a,S.v,S.cash,TOTAL)+'</div><hr class="sep"><p class="muted">Важный вопрос: как сильно общий результат зависит именно от «Авроры»?</p><div class="metric" id="concentration">'+pct(S.a/TOTAL*100)+'</div><span class="tiny muted">капитала в одной компании</span></div></div><div class="field"><label for="reason">Почему ты выбрала такое распределение?</label><textarea id="reason" placeholder="Например: я решила вложить ... потому что ...">'+esc(S.reason)+'</textarea></div><div class="actions"><button class="btn" id="commit">Зафиксировать решение →</button></div></section>';break;
case 3:
const r=calc(S.a,S.v,S.cash,-40);
h=top('Неожиданное событие','У «Авроры» проблемы','Компания потеряла крупный контракт. В этом учебном сценарии её акции упали на 40%. Посмотри, как новость повлияла на твоё решение.');
h+='<div class="note warn"><b>Событие: «Аврора» −40%</b><div class="muted tiny">Стоимость «Вектора» и резерва для этого сравнения не меняется.</div></div><div class="cards3">'+card('До события',money(TOTAL))+card('После события',money(r.total))+card('Изменение', '−'+money(r.loss),'loss')+'</div><div class="panel" style="margin-top:16px"><h2>Почему результат именно такой?</h2><p>Ты вложила в «Аврору» <b>'+money(S.a)+'</b> ('+pct(r.exposure)+ ' капитала). Её падение на 40% привело к потере <b class="loss">'+money(r.loss)+'</b>, или '+pct(r.loss/TOTAL*100)+' всего капитала.</p>'+bar(S.a*.6,S.v,S.cash,r.total)+'</div><div class="actions">'+btn('Разобрать решение →',4)+'</div></section>';break;
case 4:
h=top('Разбор','Что именно произошло?','Хороший инвестор смотрит не только на итоговую сумму, но и на причину изменения.');
h+='<div class="panel"><h2>Объясни своими словами</h2><p>Почему одна новость повлияла на твой общий капитал именно так?</p><textarea id="reflection" placeholder="Напиши, какая доля твоих денег зависела от Авроры и что изменилось после падения.">'+esc(S.reflection)+'</textarea><div id="reflection-error" class="error"></div><div class="note">Подсказка: потеря всего капитала = сумма, вложенная в компанию, × 40%. Например, если вложить 25 000, потери составят 10 000 учебных единиц.</div><div class="actions"><button class="btn" id="reflect-next">Проверить другой вариант →</button></div></div></section>';break;
case 5:
const prev=calc(S.first.a,S.first.v,S.first.cash,-40),now=calc(S.a,S.v,S.cash,-40);
h=top('Машина времени','Ты можешь переиграть момент выбора','Измени только распределение денег. Плохая новость останется той же: «Аврора» падает на 40%. Сравни последствия.');
h+='<div class="grid"><div class="panel">'+field('a','Акции «Авроры»',S.a,TOTAL)+field('v','Акции «Вектора»',S.v,TOTAL)+field('cash','Свободный резерв',S.cash,TOTAL)+'<div class="numrow"><b>Распределено</b><b id="sum">'+money(S.a+S.v+S.cash)+'</b></div><div id="alloc-error" class="error"></div></div><div class="panel"><h2>Сравнение вариантов</h2><div class="comparison"><div><div class="tiny muted">Первое решение</div><div class="metric loss">'+money(prev.loss)+'</div><span class="tiny muted">потеря</span></div><div><div class="tiny muted">Новый вариант</div><div class="metric loss" id="newloss">'+money(now.loss)+'</div><span class="tiny muted">потеря</span></div></div><hr class="sep"><div id="bar">'+bar(S.a,S.v,S.cash,TOTAL)+'</div><p class="tiny muted">При расчёте остальные активы по условию не меняются.</p></div></div><div class="note">Цель не в том, чтобы найти волшебный процент, а в том, чтобы увидеть связь между долей компании и последствиями её падения.</div><div class="actions"><button class="btn" id="retry-next">Сравнить два будущих →</button></div></section>';break;
case 6:
const down=calc(S.a,S.v,S.cash,-40),up=calc(S.a,S.v,S.cash,30);
h=top('Два будущих','А если бы «Аврора» выросла?','Теперь представь другое развитие событий: акции «Авроры» выросли на 30%. То же решение может принести прибыль — но исчезает ли риск?');
h+='<div class="comparison">'+card('Сценарий A: падение −40%','−'+money(down.loss),'loss')+card('Сценарий Б: рост +30%','+'+money(up.total-TOTAL),'gain')+'</div><div class="panel" style="margin-top:16px"><h2>Прибыль доказывает безопасность решения?</h2><p class="muted">Ответь самостоятельно. Здесь важно отличать качество принятого решения от удачного исхода.</p><div class="choice '+(S.upside==='yes'?'selected':'')+'" data-choice="yes">Да. Если выросло, значит решение было безопасным.</div><div class="choice '+(S.upside==='no'?'selected':'')+'" data-choice="no">Нет. Хороший результат не отменяет риск концентрации.</div><div id="up-feedback" class="note '+(S.upside==='no'?'good':S.upside==='yes'?'warn':'')+'">'+(S.upside==='no'?'Верно: прибыль — один из возможных исходов, а риск существовал ещё до результата.':S.upside==='yes'?'Подумай: до события ты не могла знать направление цены. При падении та же доля принесла бы потери.':'Выбери ответ и посмотри объяснение.')+'</div><div class="actions"><button id="up-next" class="btn" '+(!S.upside?'disabled':'')+'>Самостоятельная миссия →</button></div></div></section>';break;
case 7:
h=top('Без подсказок','Миссия «Орбита»','Новый сюжет. У тебя уже есть портфель на 200 000 учебных единиц. «Орбита» представила новый продукт, и знакомый предлагает докупить её акции.');
h+='<div class="grid"><div class="panel"><h2>Что уже есть?</h2><div class="numrow"><span>Акции «Орбиты»</span><b>120 000</b></div><div class="numrow"><span>Другие вложения</span><b>50 000</b></div><div class="numrow"><span>Свободный остаток</span><b>30 000</b></div><hr class="sep"><button class="btn secondary" id="view-portfolio">Изучить состав портфеля</button><div id="portfolio-detail" style="display:'+(S.missionViewed?'block':'none')+'"><p class="muted tiny">Сейчас в «Орбите» 60% капитала. После покупки на все 30 000 будет 75%.</p></div></div><div class="panel"><h2>Твой выбор</h2><p class="muted">Сколько из свободных 30 000 вложишь в «Орбиту»?</p><div class="field"><label for="mission"><span>Сумма покупки</span><b id="mission-value">'+money(S.missionAmount)+'</b></label><input id="mission" type="range" min="0" max="30000" step="1000" value="'+S.missionAmount+'"></div><div class="note"><span class="tiny muted">После покупки доля «Орбиты»</span><div class="metric" id="mission-share">'+pct((120000+S.missionAmount)/200000*100)+'</div></div></div></div><div class="field"><label for="mission-reason">Что ты решила и почему?</label><textarea id="mission-reason" placeholder="Опиши зависимость портфеля от одной компании и последствия неблагоприятного события.">'+esc(S.missionReason)+'</textarea></div><div class="field"><label for="confidence">Насколько ты уверена в решении? <b id="confidence-value">'+S.confidence+'%</b></label><input type="range" min="0" max="100" step="10" id="confidence" value="'+S.confidence+'"></div><div class="actions"><button class="btn secondary" id="hint">Показать подсказку</button><button class="btn" id="finish">Завершить миссию →</button></div><div id="hint-box" class="note" style="display:'+(S.missionHelp?'block':'none')+'">Подсказка: посмотри, какая доля *всего* портфеля зависит от «Орбиты», а не только какую часть свободных денег ты используешь.</div><div id="mission-error" class="error"></div></section>';break;
case 8:
const share=(120000+S.missionAmount)/200000*100;
const words=S.missionReason.toLowerCase();
const knowsConcentration=/(дол|процент|%|част|больш|концентрац|одн|завис|портфел)/i.test(words);
const knowsConsequence=/(рис|потер|упад|пад|убыт|сниз|измен|последств|волатил)/i.test(words);
const explainsAction=S.missionReason.trim().length>=35;
const claimsGuarantee=/(гарантир|точно не потер|без риска|невозможн.*потер)/i.test(words);
const passed=knowsConcentration&&knowsConsequence&&explainsAction&&!claimsGuarantee&&!S.missionHelp;
S.award=passed;
h=top('Итог','Твоё инвестиционное расследование завершено','Задача была не угадать, какая компания вырастет, а проверить зависимость портфеля и объяснить своё решение.');
h+='<div class="hero"><div class="big-icon">'+(passed?'🏅':'🔍')+'</div><h2>'+(passed?'Навык: проверка концентрации риска':'Тренировка завершена')+'</h2><p>'+(passed?'По предварительным текстовым признакам ты заметила концентрацию и связала её с возможными последствиями.':'Твоё объяснение полезно проверить ещё раз. Награда за осмысленную проверку требует анализа причин, а не заданного процента.')+'</p><span class="pill">'+(S.missionHelp?'С подсказкой • тренировочный результат':'Без подсказки • первая попытка')+'</span></div><div class="cards3">'+card('Покупка «Орбиты»',money(S.missionAmount))+card('Доля «Орбиты» после покупки',pct(share))+card('Уверенность',S.confidence+'%')+'</div><div class="panel" style="margin-top:16px"><h2>Твои рассуждения</h2><p>'+esc(S.missionReason)+'</p><hr class="sep"><p class="muted">Проверка текста ниже — простая автоматическая подсказка, а не надёжная оценка качества финансового решения. Для учебного эксперимента ответы должен проверить человек.</p><ul><li>'+(knowsConcentration?'✓':'○')+' Упомянута доля или зависимость капитала</li><li>'+(knowsConsequence?'✓':'○')+' Упомянуты возможные неблагоприятные последствия</li><li>'+(explainsAction?'✓':'○')+' Есть развёрнутое обоснование</li><li>'+(claimsGuarantee?'⚠':'✓')+' Нет заявлений о гарантированной безопасности</li></ul><div class="note '+(passed?'good':'')+'"><b>Главная мысль:</b> известность компании и даже её рост не устраняют риск того, что большая часть капитала зависит от одного результата.</div></div><div class="actions"><button class="btn" id="restart">Пройти заново ↻</button><button class="btn secondary" id="save">Сохранить результаты (.json)</button></div></section>';break;
}
$('app').innerHTML=h;
document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>updateStep(+b.dataset.next)));
if(S.step===2||S.step===5)bindAllocation();
if(S.step===2){$('reason').oninput=e=>S.reason=e.target.value;$('commit').onclick=()=>{if(!validateAllocation())return;if(S.reason.trim().length<10){showError('alloc-error','Напиши хотя бы одно короткое объяснение (от 10 символов).');return;}S.first={a:S.a,v:S.v,cash:S.cash,reason:S.reason};updateStep(3);};}
if(S.step===4){$('reflection').oninput=e=>S.reflection=e.target.value;$('reflect-next').onclick=()=>{if(S.reflection.trim().length<12){showError('reflection-error','Объясни причину хотя бы одним предложением.');return;}updateStep(5);};}
if(S.step===5){$('retry-next').onclick=()=>{if(validateAllocation())updateStep(6);};}
if(S.step===6){document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{S.upside=el.dataset.choice;render();});$('up-next').onclick=()=>updateStep(7);}
if(S.step===7){
$('view-portfolio').onclick=()=>{S.missionViewed=true;$('portfolio-detail').style.display='block';};
$('mission').oninput=e=>{S.missionAmount=+e.target.value;$('mission-value').textContent=money(S.missionAmount);$('mission-share').textContent=pct((120000+S.missionAmount)/200000*100);};
$('mission-reason').oninput=e=>S.missionReason=e.target.value;
$('confidence').oninput=e=>{S.confidence=+e.target.value;$('confidence-value').textContent=S.confidence+'%';};
$('hint').onclick=()=>{S.missionHelp=true;$('hint-box').style.display='block';};
$('finish').onclick=()=>{if(S.missionReason.trim().length<20){showError('mission-error','Опиши причину решения подробнее (не менее 20 символов).');return;}updateStep(8);};
}
if(S.step===8){
$('restart').onclick=()=>{Object.assign(S,{step:0,a:100000,v:0,cash:0,reason:'',first:null,reflection:'',upside:'',missionAmount:30000,missionReason:'',missionViewed:false,missionHelp:false,confidence:50,award:false});render();};
$('save').onclick=()=>{const data={date:new Date().toISOString(),initial:S.first,revised:{a:S.a,v:S.v,cash:S.cash},reflection:S.reflection,upsideAnswer:S.upside,mission:{amount:S.missionAmount,reason:S.missionReason,viewedPortfolio:S.missionViewed,usedHint:S.missionHelp,confidence:S.confidence},automatedTextCheck:S.award};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='freedom-game-result.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);};
}
}
function validateAllocation(){if(S.a+S.v+S.cash!==TOTAL){showError('alloc-error','Нужно распределить ровно 100 000 единиц. Сейчас: '+money(S.a+S.v+S.cash));return false;}return true;}
function bindAllocation(){
['a','v','cash'].forEach(id=>{$(id).addEventListener('input',e=>{const changed=+e.target.value;const others=['a','v','cash'].filter(x=>x!==id);const rest=TOTAL-changed;const oldSum=S[others[0]]+S[others[1]];let v0=oldSum?Math.round(rest*S[others[0]]/oldSum/1000)*1000:0;v0=Math.min(rest,Math.max(0,v0));S[id]=changed;S[others[0]]=v0;S[others[1]]=rest-v0;['a','v','cash'].forEach(x=>{$(x).value=S[x];$(x+'-value').textContent=money(S[x]);});$('sum').textContent=money(TOTAL);$('bar').innerHTML=bar(S.a,S.v,S.cash,TOTAL);if($('concentration'))$('concentration').textContent=pct(S.a/TOTAL*100);if($('newloss'))$('newloss').textContent=money(S.a*.4);showError('alloc-error','');});});
}
render();
})();
</script>
</body></html>
